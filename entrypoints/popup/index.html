<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Satchel</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <h1>Satchel</h1>
      <p>Pack NotebookLM flashcards into Anki-ready CSV. Nothing leaves this browser.</p>
      <ol>
        <li>Open a notebook on notebook.google.com</li>
        <li>Generate or open flashcards in Studio</li>
        <li>Use <strong>Copy CSV</strong> or <strong>Download CSV</strong> on the Satchel bar</li>
      </ol>
      <p id="status">Open a NotebookLM flashcard viewer to export.</p>
      <button type="button" id="rescan">Scan this tab</button>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
